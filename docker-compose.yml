services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: pmp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-paxala}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-paxala_media}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-paxala} -d ${POSTGRES_DB:-paxala_media}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pmp_network

  # ============================================
  # Next.js Application
  # ============================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
        - DATABASE_URL=postgresql://${POSTGRES_USER:-paxala}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-paxala_media}?schema=public
        - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    container_name: pmp_app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-paxala}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-paxala_media}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      # Cloudinary media storage; unset => uploads fall back to local disk
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      # TURN relay for playground calls. Unset => calls use public STUN only,
      # which works on most networks but not behind carrier-grade NAT.
      # Server-side only: the secret mints short-lived per-user credentials
      # and must never become a NEXT_PUBLIC_ var.
      - TURN_URL=${TURN_URL}
      - TURN_SECRET=${TURN_SECRET}
      # PAX AI. Without GEMINI_API_KEY the provider falls back to a
      # deterministic mock — the dock still works, it just returns canned text
      # instead of spending money. Server-side only.
      - PLAYGROUND_AI_PROVIDER=${PLAYGROUND_AI_PROVIDER:-gemini}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - AI_MONTHLY_CALL_CAP=${AI_MONTHLY_CALL_CAP:-5000}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      # Mount uploads directory so files persist and are accessible by nginx
      - ./public/uploads:/app/public/uploads
      # Invoice PDFs. Before this, they were written inside the container and
      # every deploy (which recreates it) deleted them. A named volume, like
      # postgres_data, survives `docker compose down`; only `down -v` (the
      # deploy script's `cleanup`) removes it. Invoices lost before this
      # existed are re-rendered from their database rows on first download.
      - storage_data:/app/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    networks:
      - pmp_network

  # ============================================
  # Nginx Reverse Proxy
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: pmp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./docker/nginx/logs:/var/log/nginx
      # Mount uploads to match the path in nginx config
      - ./public/uploads:/var/www/paxala-media/public/uploads:ro
    depends_on:
      - app
    healthcheck:
      # `nginx -t` only validates config syntax; it stays "healthy" even if
      # nginx can't reach the app upstream (e.g. after a redeploy leaves a
      # stale cached upstream IP), which masked a site-wide 502 outage.
      # Probe the actual proxied health endpoint instead, via the internal
      # /healthz location (not /api/health on port 80, which 301-redirects
      # to the public HTTPS site and would make container health depend on
      # public DNS/egress/TLS).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - pmp_network

  # ============================================
  # TURN relay (playground calls)
  # ============================================
  # Relays WebRTC media for the ~15-20% of peer pairs that cannot connect
  # directly — carrier-grade NAT on mobile data, which is the common case for
  # this audience. Everything else still connects peer-to-peer and never
  # touches this container.
  #
  # network_mode: host is not laziness. TURN hands out the addresses it will
  # relay on, so it has to see the real host interface, and a relay port range
  # published through Docker's userland proxy would be both wrong and slow.
  # This means UFW must open the ports itself:
  #   ufw allow 3478/tcp && ufw allow 3478/udp
  #   ufw allow 49160:49200/udp
  coturn:
    image: coturn/coturn:alpine
    container_name: pmp_coturn
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      # Passed as flags rather than baked into the file so the secret stays in
      # .env.production with every other credential.
      - --static-auth-secret=${TURN_SECRET:-}
      - --realm=${TURN_REALM:-paxaland.com}
      - --external-ip=${TURN_EXTERNAL_IP:-}
    profiles:
      # Opt-in: `docker compose --profile calls up -d`. Without TURN_* set the
      # app degrades to STUN-only rather than starting a relay that would
      # reject every credential it is handed.
      - calls

  # ============================================
  # Database Migrations (one-time job)
  # ============================================
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: pmp_migrate
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-paxala}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-paxala_media}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - pmp_network
    profiles:
      - migrate

networks:
  pmp_network:
    driver: bridge
    name: pmp_network

volumes:
  postgres_data:
    name: pmp_postgres_data
  storage_data:
    name: pmp_storage_data
