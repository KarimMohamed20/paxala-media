# coturn — TURN/STUN relay for playground calls.
#
# Only the pairs that cannot reach each other directly are relayed; everything
# else stays peer-to-peer and never appears here. Budget note: a relayed call
# leg costs real VPS bandwidth (~0.5-1 Mbps each way per stream), which is why
# the relay is a fallback rather than the default path.
#
# The shared secret, realm and external IP are NOT in this file — they are
# passed as flags from docker-compose so every credential lives in
# .env.production alongside the others. See docker-compose.yml (coturn).

listening-port=3478

# Long-term credentials derived from a shared secret (coturn's "REST API"
# scheme). The app mints username=<expiry>:<userId> plus an HMAC of it, so no
# user list exists here and a leaked credential expires within hours.
# See src/lib/playground/call/ice.ts.
use-auth-secret

# Relay range. Must match the UFW rule:  ufw allow 49160:49200/udp
# 40 ports is ample — a relayed peer connection uses one.
min-port=49160
max-port=49200

# Refuse to relay to anything internal. Without this, a participant could aim
# the relay at the VPS's own services (Postgres on 5432, the app on 3000) and
# use it as a proxy into the private network.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# One user should not be able to saturate the VPS uplink.
user-quota=12
total-quota=60
bps-capacity=0

fingerprint
stale-nonce=600

# No TLS in v1: media is already encrypted end-to-end by SRTP/DTLS, so
# turns:// buys confidentiality of the signalling metadata only, at the cost
# of wiring nginx's certificates into a second container. Revisit if calls
# need to survive networks that block anything but 443.
no-tls
no-dtls

# The admin CLI listens on 5766 with a default password; nothing here uses it.
no-cli

# Quiet by default — verbose logs a busy call to disk continuously.
no-stdout-log
log-file=stdout
simple-log
