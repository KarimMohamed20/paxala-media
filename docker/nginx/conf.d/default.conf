# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name paxaland.com www.paxaland.com;

    # Client max body size (for file uploads)
    client_max_body_size 1G;
    client_body_timeout 600s;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal health check for the Docker healthcheck probe. Must not go
    # through the HTTPS redirect below — the healthcheck runs inside the
    # container and should never depend on public DNS/TLS/egress.
    location = /healthz {
        access_log off;
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app/api/health;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paxaland.com www.paxaland.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (optional - uncomment when ready)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client max body size (for file uploads - increased for large media files)
    client_max_body_size 1G;
    client_body_timeout 600s;

    # Root directory for static files
    root /var/www/paxala-media;

    # Static file uploads (served directly by nginx for better performance)
    # Maps https://paxaland.com/uploads/* to /var/www/paxala-media/public/uploads/*
    location /uploads/ {
        alias /var/www/paxala-media/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        try_files $uri =404;
    }

    # Next.js static files
    location /_next/static/ {
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    # Public static files
    location /images/ {
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # PMP Playground: live collaboration (SSE stream + batched canvas ops).
    #
    # nginx selects the LONGEST matching prefix, so this wins over `location /api/`
    # regardless of the order the two blocks appear in.
    #
    # Three settings here are load-bearing, and every one of them fails INVISIBLY
    # in development — `next dev` has no nginx at all, and docker-compose
    # publishes the app on :3000, which bypasses this proxy entirely. The stream
    # must be verified through https on 443 or it has not been verified.
    #
    #   proxy_buffering off   nginx buffers proxied responses by default, so
    #                         without this every SSE frame sits in a buffer and
    #                         the room looks frozen until the buffer fills. The
    #                         app also sends `X-Accel-Buffering: no`, which nginx
    #                         honours because `proxy_ignore_headers` is unset —
    #                         this line is the belt to that braces.
    #   proxy_read_timeout    a healthy stream is idle between events. The app
    #                         heartbeats every 20s and recycles the connection at
    #                         15 minutes; 900s comfortably contains both.
    #   Connection ""         the shared /api/ block forwards `Connection: upgrade`
    #                         for websockets. SSE is a plain HTTP response, and
    #                         an upgrade header on it confuses intermediaries.
    location /api/playground/ {
        limit_req zone=playground burst=200 nodelay;
        limit_conn addr 60;

        # Variable + resolver like every other location: a static upstream
        # caches the app container's IP across redeploys and 502s silently.
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 900s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 900s;
    }

    # API routes with rate limiting
    location /api/ {
        limit_req zone=api burst=50 nodelay;
        limit_conn addr 20;

        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        # Increased timeouts for large file uploads (1GB - 10 minutes)
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Health check endpoint (no rate limit)
    location /api/health {
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Main application
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        # Increased timeouts for large file uploads (1GB - 10 minutes)
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;

        # Handle errors gracefully
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # Error pages
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Secondary domain (HTTP): paxalamedia.com
# The client legitimately owns this domain alongside paxaland.com. Public
# marketing pages are served directly on this domain too, so plain HTTP
# traffic upgrades to HTTPS on the SAME host — the HTTPS block below is what
# decides, per path, whether to serve directly or redirect to paxaland.com.
server {
    listen 80;
    listen [::]:80;
    server_name paxalamedia.com www.paxalamedia.com;

    client_max_body_size 1G;
    client_body_timeout 600s;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Secondary domain (HTTPS): paxalamedia.com
# The client legitimately owns this domain alongside paxaland.com. Public
# marketing pages are served directly on this domain. Protected/authenticated
# areas (portal, admin, staff) and NextAuth's own endpoints redirect to the
# canonical domain (paxaland.com) because NEXTAUTH_URL — and therefore session
# cookies/CSRF handling — is bound to a single origin.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paxalamedia.com www.paxalamedia.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/paxalamedia-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/paxalamedia-privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client max body size (for file uploads - increased for large media files)
    client_max_body_size 1G;
    client_body_timeout 600s;

    # Protected/authenticated areas: redirect to the canonical domain.
    # NextAuth (NEXTAUTH_URL) and session cookies are bound to paxaland.com,
    # so these must never be served directly from this origin.
    location /portal {
        return 301 https://paxaland.com$request_uri;
    }

    location /admin {
        return 301 https://paxaland.com$request_uri;
    }

    location /staff {
        return 301 https://paxaland.com$request_uri;
    }

    location /api/auth {
        return 301 https://paxaland.com$request_uri;
    }

    # Everything else: serve the public app directly on this domain.
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_conn addr 10;

        set $upstream_app app:3000;
        proxy_pass http://$upstream_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_cache_bypass $http_upgrade;
        # Increased timeouts for large file uploads (1GB - 10 minutes)
        proxy_read_timeout 600s;
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;

        # Handle errors gracefully
        proxy_intercept_errors on;
        error_page 502 503 504 /50x.html;
    }

    # Error pages
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
