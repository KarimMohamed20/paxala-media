# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name paxaland.com www.paxaland.com;

    # Client max body size (for file uploads)
    client_max_body_size 1G;
    client_body_timeout 600s;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Internal health check for the Docker healthcheck probe. Must not go
    # through the HTTPS redirect below — the healthcheck runs inside the
    # container and should never depend on public DNS/TLS/egress.
    location = /healthz {
        access_log off;
        set $upstream_app app:3000;
        proxy_pass http://$upstream_app/api/health;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paxaland.com www.paxaland.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS (optional - uncomment when ready)
    # add_header Strict-Transport-Security "max-age=63072000" always;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client max body size (for file uploads - increased for large media files)
    client_max_body_size 1G;
    client_body_timeout 600s;

    # Root directory for static files
    root /var/www/paxala-media;

    include /etc/nginx/conf.d/app-locations.inc;
}

# Second domain (HTTP): paxalamedia.com
# The client owns this domain alongside paxaland.com, and the whole app is
# served on both. Plain HTTP upgrades to HTTPS on the SAME host.
server {
    listen 80;
    listen [::]:80;
    server_name paxalamedia.com www.paxalamedia.com;

    client_max_body_size 1G;
    client_body_timeout 600s;

    # Allow Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Second domain (HTTPS): paxalamedia.com
# Serves the full app, portal included — exactly the locations paxaland.com
# serves. Portal, admin and staff pages used to 301 to paxaland.com because
# NextAuth was bound to the single origin in NEXTAUTH_URL; with
# AUTH_TRUST_HOST (docker-compose.yml) it takes its origin from the request,
# so each domain signs in on itself. Sessions are per domain: browsers never
# share cookies across two different domains, so signing in on one does not
# sign you in on the other.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name paxalamedia.com www.paxalamedia.com;

    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/paxalamedia-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/paxalamedia-privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Client max body size (for file uploads - increased for large media files)
    client_max_body_size 1G;
    client_body_timeout 600s;

    include /etc/nginx/conf.d/app-locations.inc;
}
