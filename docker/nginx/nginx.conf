# Nginx main configuration for Paxala Media Production
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    log_format json_combined escape=json
        '{'
            '"time_local":"$time_local",'
            '"remote_addr":"$remote_addr",'
            '"remote_user":"$remote_user",'
            '"request":"$request",'
            '"status": "$status",'
            '"body_bytes_sent":"$body_bytes_sent",'
            '"request_time":"$request_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"request_id":"$request_id"'
        '}';

    access_log /var/log/nginx/access.log main;

    # Performance settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # PMP Playground needs its own budget. These zones are keyed on CLIENT IP, so
    # everyone in one PMP office shares one bucket. A live room sends a batched
    # canvas/presence request roughly every 100ms per participant, so six people
    # behind one NAT sit near 60 r/s sustained — double the `api` zone's 30 r/s,
    # which would fill its 50-slot burst in about 1.2 seconds and then 503
    # EVERYTHING under /api/ from that address, including NextAuth and the
    # EventSource reconnect itself.
    #
    # limit_conn is raised for the same reason: each participant holds one
    # long-lived SSE connection open on top of their normal requests, and the
    # shared `addr 20` would be exhausted by a handful of tabs in one office.
    limit_req_zone $binary_remote_addr zone=playground:10m rate=120r/s;

    # Upstream for Next.js app
    upstream nextjs_upstream {
        server app:3000;
        keepalive 64;
    }

    # Include server configurations
    include /etc/nginx/conf.d/*.conf;
}
